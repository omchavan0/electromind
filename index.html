<!doctype html>
<html lang="mr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1456D9">
<title>ElectroMind</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#1456D9; --bg:#F3F5F9; --card:#fff; --border:#DDE3EE;
  --text:#0E1726; --muted:#5B6578;
  --res-bg:#E3F6EA; --res-border:#2E9E5B; --res-text:#0B5A2C;
  --warn-bg:#FFF4D6; --warn-border:#E6C45C; --warn-text:#5A3F00;
  --err:#B3261E;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Mukta,system-ui,sans-serif;font-size:16px;line-height:1.35}
#app{max-width:520px;margin:0 auto;min-height:100vh;padding:0 0 88px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;padding:20px 20px 8px}
.brand{font-size:28px;font-weight:800;color:var(--primary);line-height:1.1}
.sub{font-size:15px;color:var(--muted)}
.lang{display:flex;background:#fff;border:1px solid var(--border);border-radius:999px;padding:3px}
.lang button{border:0;background:none;padding:8px 12px;border-radius:999px;font-size:14px;font-weight:600;color:var(--muted);min-height:36px}
.lang button.on{background:var(--primary);color:#fff;font-weight:800}
.big{display:flex;align-items:center;gap:14px;width:calc(100% - 40px);margin:8px 20px;padding:18px;border-radius:20px;text-align:left;min-height:68px;border:2px solid var(--primary)}
.big.fill{background:var(--primary);color:#fff}
.big.line{background:#fff;color:var(--primary)}
.big b{display:block;font-size:21px;font-weight:800}
.big span{font-size:14px;opacity:.9}
.big.line span{color:var(--muted);opacity:1}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:6px 20px}
.tile{background:#fff;border:1px solid var(--border);border-radius:14px;padding:12px 6px;text-align:center;font-size:14px;font-weight:600;min-height:64px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.tile small{font-weight:400;color:var(--muted);font-size:12px}
.sec{display:flex;justify-content:space-between;padding:14px 20px 4px;font-weight:800}
.item{margin:6px 20px;background:#fff;border:1px solid var(--border);border-radius:16px;padding:12px 16px}
.item .k{font-size:14px;color:var(--muted)}
.item .v{font-size:20px;font-weight:800;color:var(--res-text)}
.empty{margin:6px 20px;color:var(--muted);font-size:15px}
.bar{display:flex;align-items:center;gap:8px;padding:16px 12px 6px}
.bar h1{margin:0;font-size:22px;font-weight:800}
.back{border:0;background:none;font-size:30px;color:var(--muted);width:44px;height:44px;line-height:1}
.res{margin:8px 16px;background:var(--res-bg);border:2px solid var(--res-border);border-radius:20px;padding:14px 18px;color:var(--res-text)}
.res .l{font-size:14px;font-weight:600}
.res .n{font-size:38px;font-weight:800;line-height:1.1}
.res .d{font-size:14px}
.res.bad{background:#fff;border-color:var(--err);color:var(--err)}
.note{margin:8px 16px;background:var(--warn-bg);border:1px solid var(--warn-border);border-radius:14px;padding:10px 14px;font-size:14px;color:var(--warn-text)}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:6px 16px}
.chip{background:#fff;border:1px solid var(--border);border-radius:999px;padding:10px 16px;font-size:15px;font-weight:600;min-height:44px}
.chip.on{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:800}
.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:6px 16px}
.fields.two{grid-template-columns:repeat(2,1fr)}
.f{background:#fff;border:1px solid var(--border);border-radius:14px;padding:8px 12px}
.f:focus-within{border:2px solid var(--primary);padding:7px 11px}
.f label{display:block;font-size:13px;color:var(--muted)}
.f input{width:100%;border:0;outline:0;background:none;font:inherit;font-size:26px;font-weight:800;color:var(--text);padding:2px 0;min-height:40px}
.lab{padding:10px 16px 0;font-size:13px;color:var(--muted)}
.actions{padding:12px 16px}
.save{width:100%;min-height:54px;border:0;border-radius:14px;background:var(--primary);color:#fff;font-size:18px;font-weight:800}
.meter{margin:8px 16px;background:#fff;border:1px solid var(--border);border-radius:14px;padding:10px 14px}
.meter .r{display:flex;justify-content:space-between;font-size:14px}
.track{margin-top:8px;height:10px;border-radius:5px;background:#E8ECF4;overflow:hidden}
.fillbar{height:10px;border-radius:5px;background:var(--res-border)}
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--border);display:flex;justify-content:center;padding:6px 8px calc(10px + env(safe-area-inset-bottom))}
.nav div{display:flex;width:100%;max-width:520px}
.nav button{flex:1;border:0;background:none;min-height:52px;font-size:14px;font-weight:600;color:var(--muted)}
.nav button.on{color:var(--primary);font-weight:800}
.clear{margin:12px 20px;width:calc(100% - 40px);min-height:48px;border:1px solid var(--border);background:#fff;border-radius:14px;font-weight:600;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--text);color:#fff;padding:10px 18px;border-radius:999px;font-size:15px}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
/* ---------- Texts (mr / hi / en) ---------- */
const T = {
 mr:{sub:"इलेक्ट्रिकल आणि बॅटरी कॅल्क्युलेटर",hello:"नमस्कार, काय काढायचे आहे?",
  backup:"बॅकअप टाइम",backupS:"बॅटरी किती वेळ चालेल",wire:"वायर साइज",wireS:"व्होल्टेज ड्रॉपसह, गाडीसाठी",
  fuse:"फ्यूज / रिले",load:"लोड",motor:"मोटर",res:"रेझिस्टर",unit:"युनिट",ai:"स्मार्ट AI",soon:"लवकरच",
  recent:"अलीकडील",all:"सर्व",none:"अजून काही सेव्ह केलेले नाही.",home:"मुख्य",hist:"इतिहास",
  V:"व्होल्ट (V)",Ah:"क्षमता (Ah)",W:"लोड (W)",chem:"बॅटरी प्रकार",lead:"लेड-अॅसिड",agm:"AGM",lfp:"LiFePO4",
  dod:"DoD (%)",eff:"कार्यक्षमता (%)",est:"अंदाजे बॅकअप",usable:"वापरता येणारी ऊर्जा",
  hr:"तास",mn:"मिनिटे",save:"सेव्ह करा",saved:"सेव्ह झाले",clear:"इतिहास पुसा",
  bad:"सर्व आकडे 0 पेक्षा मोठे भरा (DoD आणि कार्यक्षमता 1–100).",
  peuk:"लोड जास्त आहे. लेड-अॅसिड/AGM बॅटरीवर प्रत्यक्ष वेळ यापेक्षा कमी मिळेल.",
  bnote:"हा अंदाज आहे. बॅटरीचे वय, तापमान आणि लोडनुसार वेळ बदलतो.",
  A:"करंट (A)",L:"लांबी (m, एकेरी)",md:"ड्रॉप मर्यादा (%)",mat:"तारेचा प्रकार",cu:"तांबे",al:"अॅल्युमिनियम",
  right:"योग्य वायर",dropT:"व्होल्टेज ड्रॉप",limit:"मर्यादा",fuseT:"फ्यूज",
  wnote:"गृहीत: तापमान 20°C, जाऊन-येऊन लांबी (2×). हा अंदाज आहे, सुरक्षित वापरासाठी मानक आणि तज्ज्ञांकडून तपासा.",
  wbad:"सर्व आकडे 0 पेक्षा मोठे भरा.",wbig:"एवढ्या करंटसाठी तक्त्यातील सर्वात मोठी वायर पुरेशी नाही. तज्ज्ञांचा सल्ला घ्या."},
 hi:{sub:"इलेक्ट्रिकल और बैटरी कैलकुलेटर",hello:"नमस्ते, क्या निकालना है?",
  backup:"बैकअप टाइम",backupS:"बैटरी कितनी देर चलेगी",wire:"वायर साइज़",wireS:"वोल्टेज ड्रॉप सहित, गाड़ी के लिए",
  fuse:"फ्यूज़ / रिले",load:"लोड",motor:"मोटर",res:"रेज़िस्टर",unit:"यूनिट",ai:"स्मार्ट AI",soon:"जल्द",
  recent:"हाल के",all:"सभी",none:"अभी कुछ सेव नहीं है।",home:"मुख्य",hist:"इतिहास",
  V:"वोल्ट (V)",Ah:"क्षमता (Ah)",W:"लोड (W)",chem:"बैटरी प्रकार",lead:"लेड-एसिड",agm:"AGM",lfp:"LiFePO4",
  dod:"DoD (%)",eff:"दक्षता (%)",est:"अनुमानित बैकअप",usable:"उपयोगी ऊर्जा",
  hr:"घंटे",mn:"मिनट",save:"सेव करें",saved:"सेव हो गया",clear:"इतिहास मिटाएँ",
  bad:"सभी मान 0 से बड़े भरें (DoD और दक्षता 1–100)।",
  peuk:"लोड ज़्यादा है। लेड-एसिड/AGM बैटरी पर असली समय इससे कम मिलेगा।",
  bnote:"यह अनुमान है। बैटरी की उम्र, तापमान और लोड के अनुसार समय बदलता है।",
  A:"करंट (A)",L:"लंबाई (m, एक तरफ़)",md:"ड्रॉप सीमा (%)",mat:"तार का प्रकार",cu:"तांबा",al:"एल्युमिनियम",
  right:"सही वायर",dropT:"वोल्टेज ड्रॉप",limit:"सीमा",fuseT:"फ्यूज़",
  wnote:"मान्यता: तापमान 20°C, आना-जाना लंबाई (2×)। यह अनुमान है, सुरक्षित उपयोग के लिए मानक और विशेषज्ञ से जाँचें।",
  wbad:"सभी मान 0 से बड़े भरें।",wbig:"इस करंट के लिए तालिका की सबसे बड़ी वायर काफ़ी नहीं है। विशेषज्ञ की सलाह लें।"},
 en:{sub:"Electrical & Battery Calculator",hello:"Hello, what do you want to calculate?",
  backup:"Backup Time",backupS:"How long will the battery last",wire:"Wire Size",wireS:"With voltage drop, for vehicles",
  fuse:"Fuse / Relay",load:"Load",motor:"Motor",res:"Resistor",unit:"Units",ai:"Smart AI",soon:"Soon",
  recent:"Recent",all:"All",none:"Nothing saved yet.",home:"Home",hist:"History",
  V:"Voltage (V)",Ah:"Capacity (Ah)",W:"Load (W)",chem:"Battery type",lead:"Lead-acid",agm:"AGM",lfp:"LiFePO4",
  dod:"DoD (%)",eff:"Efficiency (%)",est:"Estimated backup",usable:"Usable energy",
  hr:"h",mn:"min",save:"Save",saved:"Saved",clear:"Clear history",
  bad:"Enter all values above 0 (DoD and efficiency 1–100).",
  peuk:"High load. On lead-acid/AGM the real runtime will be shorter than this.",
  bnote:"This is an estimate. Runtime changes with battery age, temperature and load.",
  A:"Current (A)",L:"Length (m, one way)",md:"Drop limit (%)",mat:"Conductor",cu:"Copper",al:"Aluminium",
  right:"Suggested wire",dropT:"Voltage drop",limit:"limit",fuseT:"Fuse",
  wnote:"Assumed: 20°C, round-trip length (2×). This is an estimate; check standards and ask a qualified person for safe use.",
  wbad:"Enter all values above 0.",wbig:"The largest size in the table is not enough for this current. Consult a professional."}
};
/* ---------- Calculation engine (kept separate, easy to test) ---------- */
const CHEM = {lead:{dod:50,eff:85}, agm:{dod:60,eff:85}, lfp:{dod:80,eff:95}};
const SIZES = [0.5,0.75,1,1.5,2.5,4,6,10,16,25,35,50,70,95];            // mm²
const AMPS  = {0.5:5,0.75:8,1:10,1.5:15,2.5:20,4:30,6:40,10:60,16:80,25:110,35:140,50:170,70:215,95:260}; // rough chassis-wiring limits (Cu)
const AWG   = {0.5:"20",0.75:"18",1:"17",1.5:"16",2.5:"14",4:"12",6:"10",10:"8",16:"6",25:"4",35:"2",50:"1/0",70:"2/0",95:"3/0"};
const FUSES = [1,2,3,5,7.5,10,15,20,25,30,40,50,60,80,100,125,150,200];
const RHO   = {cu:0.0175, al:0.0282};   // Ω·mm²/m at 20°C
const AL_DERATE = 0.78;

function backupCalc(V,Ah,W,dod,eff){
  const usableWh = V*Ah*(dod/100)*(eff/100);
  const hours = usableWh/W;
  let h = Math.floor(hours), m = Math.round((hours-h)*60);
  if(m===60){h+=1;m=0}
  return {usableWh,hours,h,m,amps:W/V};
}
function wireCalc(V,I,L,dropPct,mat){
  const rho = RHO[mat];
  const reqArea = rho*2*L*I/(V*dropPct/100);
  const k = mat==='al'?AL_DERATE:1;
  const size = SIZES.find(s => s>=reqArea && AMPS[s]*k>=I);
  if(!size) return null;
  const drop = rho*2*L*I/size;
  const fuse = FUSES.find(f => f>=I*1.25) || null;
  return {reqArea,size,drop,dropPct:drop/V*100,fuse};
}

/* ---------- State ---------- */
const $ = s => document.querySelector(s);
const store = {
  get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
let lang = store.get('em_lang','mr');
let view = 'home';
let hist = store.get('em_hist',[]);
const B = store.get('em_b',{V:12,Ah:80,W:250,chem:'lead',dod:50,eff:85});
const W_ = store.get('em_w',{V:12,I:10,L:5,drop:3,mat:'cu'});
const t = k => T[lang][k];
const num = v => { const n = parseFloat(String(v).replace(',','.')); return isFinite(n)?n:NaN };
const fmt = (n,d=2) => String(+n.toFixed(d));
const digits = s => (lang==='en') ? s : String(s).replace(/[0-9]/g,c=>'०१२३४५६७८९'[c]);
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- Pieces ---------- */
const langBar = () => `<div class="lang" role="group" aria-label="Language">${
  [['mr','मर'],['hi','हिं'],['en','EN']].map(([c,l])=>`<button data-lang="${c}" class="${lang===c?'on':''}">${l}</button>`).join('')}</div>`;
const navBar = () => `<nav class="nav"><div>
  <button data-go="home" class="${view==='home'?'on':''}">${t('home')}</button>
  <button data-go="hist" class="${view==='hist'?'on':''}">${t('hist')}</button></div></nav>`;
const field = (id,label,val,mode='decimal') => `<div class="f"><label for="${id}">${label}</label><input id="${id}" inputmode="${mode}" value="${esc(val)}"></div>`;
const chip = (attr,val,label,on) => `<button class="chip ${on?'on':''}" ${attr}="${val}">${label}</button>`;
const top = title => `<div class="bar"><button class="back" data-go="home" aria-label="${t('home')}">‹</button><h1>${title}</h1></div>`;

/* ---------- Views ---------- */
function homeView(){
  const tiles = [['fuse',''],['load',''],['motor',''],['res',''],['unit',''],['ai','']]
    .map(([k])=>`<div class="tile">${t(k)}<small>${t('soon')}</small></div>`).join('');
  const rec = hist.slice(0,3).map(h=>`<div class="item"><div class="k">${esc(h.title)}</div><div class="v">${esc(h.result)}</div></div>`).join('')
    || `<div class="empty">${t('none')}</div>`;
  return `<div class="top"><div><div class="brand">ElectroMind</div><div class="sub">${t('sub')}</div></div>${langBar()}</div>
  <div class="sub" style="padding:4px 20px">${t('hello')}</div>
  <button class="big fill" data-go="backup"><div><b>${t('backup')}</b><span>${t('backupS')}</span></div></button>
  <button class="big line" data-go="wire"><div><b>${t('wire')}</b><span>${t('wireS')}</span></div></button>
  <div class="grid">${tiles}</div>
  <div class="sec"><span>${t('recent')}</span><a href="#" data-go="hist" style="color:var(--primary);font-weight:600;text-decoration:none">${t('all')}</a></div>${rec}${navBar()}`;
}
function backupView(){
  return `${top(t('backup'))}
  <div id="out"></div>
  <div class="chips">${[12,24,48].map(v=>chip('data-v',v,v+'V',B.V==v)).join('')}</div>
  <div class="lab">${t('chem')}</div>
  <div class="chips">${['lead','agm','lfp'].map(c=>chip('data-chem',c,t(c),B.chem===c)).join('')}</div>
  <div class="fields">${field('V',t('V'),B.V)}${field('Ah',t('Ah'),B.Ah)}${field('W',t('W'),B.W)}</div>
  <div class="fields two" style="padding-top:8px">${field('dod',t('dod'),B.dod)}${field('eff',t('eff'),B.eff)}</div>
  <div class="actions"><button class="save" id="save">${t('save')}</button></div>`;
}
function wireView(){
  return `${top(t('wire'))}
  <div id="out"></div>
  <div class="chips">${[12,24,48].map(v=>chip('data-v',v,v+'V',W_.V==v)).join('')}${['cu','al'].map(m=>chip('data-mat',m,t(m),W_.mat===m)).join('')}</div>
  <div class="fields">${field('I',t('A'),W_.I)}${field('L',t('L'),W_.L)}${field('drop',t('md'),W_.drop)}</div>
  <div class="fields two" style="padding-top:8px">${field('V',t('V'),W_.V)}</div>
  <div class="actions"><button class="save" id="save">${t('save')}</button></div>`;
}
function histView(){
  const list = hist.map(h=>`<div class="item"><div class="k">${esc(h.title)} · ${esc(h.when)}</div><div class="v">${esc(h.result)}</div></div>`).join('')
    || `<div class="empty">${t('none')}</div>`;
  return `${top(t('hist'))}${list}${hist.length?`<button class="clear" id="clr">${t('clear')}</button>`:''}${navBar()}`;
}

/* ---------- Live update ---------- */
let last = null;   // last valid result to save
function updBackup(){
  B.V=num($('#V').value);B.Ah=num($('#Ah').value);B.W=num($('#W').value);B.dod=num($('#dod').value);B.eff=num($('#eff').value);
  store.set('em_b',B);
  const ok=[B.V,B.Ah,B.W].every(x=>x>0)&&B.dod>=1&&B.dod<=100&&B.eff>=1&&B.eff<=100;
  if(!ok){last=null;$('#out').innerHTML=`<div class="res bad"><div class="d">${t('bad')}</div></div>`;return}
  const r=backupCalc(B.V,B.Ah,B.W,B.dod,B.eff);
  const txt = `${digits(r.h)} ${t('hr')} ${digits(r.m)} ${t('mn')}`;
  last={title:`${t('backup')} · ${fmt(B.V,1)}V ${fmt(B.Ah,1)}Ah ${fmt(B.W,0)}W`,result:txt};
  const peuk=(B.chem!=='lfp'&&r.amps>B.Ah/5)?`<div class="note">${t('peuk')}</div>`:'';
  $('#out').innerHTML=`<div class="res"><div class="l">${t('est')}</div><div class="n">${txt}</div>
   <div class="d">${t('usable')}: ${fmt(r.usableWh,0)} Wh ÷ ${fmt(B.W,0)} W</div></div>${peuk}<div class="note">${t('bnote')}</div>`;
}
function updWire(){
  W_.V=num($('#V').value);W_.I=num($('#I').value);W_.L=num($('#L').value);W_.drop=num($('#drop').value);
  store.set('em_w',W_);
  if(![W_.V,W_.I,W_.L,W_.drop].every(x=>x>0)){last=null;$('#out').innerHTML=`<div class="res bad"><div class="d">${t('wbad')}</div></div>`;return}
  const r=wireCalc(W_.V,W_.I,W_.L,W_.drop,W_.mat);
  if(!r){last=null;$('#out').innerHTML=`<div class="res bad"><div class="d">${t('wbig')}</div></div>`;return}
  const ok=r.dropPct<=W_.drop;
  last={title:`${t('wire')} · ${fmt(W_.V,1)}V ${fmt(W_.I,1)}A ${fmt(W_.L,1)}m`,result:`${r.size} mm² (≈ ${AWG[r.size]} AWG)`};
  $('#out').innerHTML=`<div class="res"><div class="l">${t('right')}</div>
   <div class="n">${r.size} mm² <span style="font-size:18px">(≈ ${AWG[r.size]} AWG)</span></div>
   <div class="d">${t('dropT')} ${fmt(r.dropPct,1)} % (${fmt(r.drop,2)} V)${r.fuse?` · ${t('fuseT')} ${r.fuse} A`:''}</div></div>
   <div class="meter"><div class="r"><span>${t('dropT')}</span><b>${fmt(r.dropPct,1)} % / ${t('limit')} ${fmt(W_.drop,1)} %</b></div>
   <div class="track"><div class="fillbar" style="width:${Math.min(100,r.dropPct/W_.drop*100)}%"></div></div></div>
   <div class="note">${t('wnote')}</div>`;
}

/* ---------- Render + events ---------- */
function toast(m){const e=document.createElement('div');e.className='toast';e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),1400)}
function render(){
  const app=$('#app');
  app.innerHTML = view==='home'?homeView():view==='backup'?backupView():view==='wire'?wireView():histView();
  document.documentElement.lang=lang;
  if(view==='backup')updBackup();
  if(view==='wire')updWire();
  window.scrollTo(0,0);
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-go],[data-lang],[data-v],[data-chem],[data-mat],#save,#clr');
  if(!el)return;
  if(el.dataset.go){e.preventDefault();view=el.dataset.go;render();return}
  if(el.dataset.lang){lang=el.dataset.lang;store.set('em_lang',lang);render();return}
  if(el.dataset.v){$('#V').value=el.dataset.v;document.querySelectorAll('[data-v]').forEach(b=>b.classList.toggle('on',b===el));view==='backup'?updBackup():updWire();return}
  if(el.dataset.chem){B.chem=el.dataset.chem;$('#dod').value=CHEM[B.chem].dod;$('#eff').value=CHEM[B.chem].eff;
    document.querySelectorAll('[data-chem]').forEach(b=>b.classList.toggle('on',b===el));updBackup();return}
  if(el.dataset.mat){W_.mat=el.dataset.mat;document.querySelectorAll('[data-mat]').forEach(b=>b.classList.toggle('on',b===el));updWire();return}
  if(el.id==='save'){if(!last)return;
    hist.unshift({...last,when:new Date().toLocaleString(lang==='en'?'en-IN':'mr-IN',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})});
    hist=hist.slice(0,50);store.set('em_hist',hist);toast(t('saved'));return}
  if(el.id==='clr'){hist=[];store.set('em_hist',hist);render()}
});
document.addEventListener('input',e=>{ if(e.target.matches('.f input')) view==='backup'?updBackup():updWire(); });
render();
</script>
</body>
</html>
